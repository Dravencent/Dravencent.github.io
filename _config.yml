locale: en-US
title: Yu Zhan
name: Yu Zhan
description: Ph.D. student researching the intelligent design of lithium-battery electrolytes.
url: https://dravencent.github.io
baseurl: ""
repository: Dravencent/Dravencent.github.io
theme: null
future: false
timezone: Asia/Shanghai
encoding: utf-8
markdown: kramdown
highlighter: rouge

analytics:
  provider: false

include:
  - _pages

exclude:
  - .github
  - .gitignore
  - .worktrees
  - .local-tools
  - .test-output
  - .bundle
  - .superpowers
  - _site
  - docs
  - tests
  - scripts
  - node_modules
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - requirements-tools.txt
  - requirements-pdf-tools.txt
  - images/My.png

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic
      author_profile: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
